<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #0066cc; color: white; }
    </style>
</head>
<body>
<h1>Log degli accessi</h1>
<table id="logTable">
    <thead><tr><th>Data</th><th>Latitudine</th><th>Longitudine</th><th>Categoria</th><th>IP</th></thead>
    <tbody></tbody>
</table>
<script>
    async function loadLogs() {
        try {
            const res = await fetch('/api/logs');
            if (!res.ok) {
                if (res.status === 401) {
                    document.body.innerHTML = '<h2>Autenticazione richiesta</h2><p>Usa admin / segreto</p>';
                    return;
                }
                throw new Error('Errore caricamento');
            }
            const logs = await res.json();
            const tbody = document.querySelector('#logTable tbody');
            tbody.innerHTML = '';
            logs.forEach(log => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = new Date(log.timestamp).toLocaleString();
                row.insertCell(1).textContent = log.location?.lat || '-';
                row.insertCell(2).textContent = log.location?.lon || '-';
                row.insertCell(3).textContent = log.category || '-';
                row.insertCell(4).textContent = log.ip || '-';
            });
        } catch (err) {
            console.error(err);
        }
    }
    loadLogs();
    setInterval(loadLogs, 10000);
</script>
</body>
</html>
