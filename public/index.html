<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Localizzazione</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
            text-align: center;
            background: #f5f7fa;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background: #0052a3;
        }
        #status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 16px;
            background: #eef2f7;
        }
        .error {
            color: #c00;
        }
        .success {
            color: #2c7a4d;
        }
        .warning {
            color: #e67e22;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📍 Benvenuto</h1>
    <p>Per accedere ai contenuti, abbiamo bisogno della tua posizione esatta.</p>
    <button id="requestBtn">📡 Condividi posizione</button>
    <div id="status"></div>
    <p style="font-size: 0.8rem; margin-top: 2rem; color: #666;">
        La posizione viene usata solo per statistiche di accesso. <br>
        Nessun dato viene venduto a terze parti.
    </p>
</div>

<script>
    const btn = document.getElementById('requestBtn');
    const statusDiv = document.getElementById('status');

    async function sendToServer(locationData, deviceInfo) {
        try {
            const response = await fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ location: locationData, deviceInfo: deviceInfo })
            });
            if (response.ok) {
                statusDiv.innerHTML = '<span class="success">✅ Grazie! Posizione registrata correttamente.</span>';
            } else {
                statusDiv.innerHTML = '<span class="error">⚠️ Errore durante l’invio. Riprova più tardi.</span>';
            }
        } catch (err) {
            console.error(err);
            statusDiv.innerHTML = '<span class="error">❌ Problema di connessione al server.</span>';
        }
    }

    function getDeviceInfo() {
        return {
            screenWidth: window.screen.width,
            screenHeight: window.screen.height,
            language: navigator.language,
            platform: navigator.platform,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            cookiesEnabled: navigator.cookieEnabled,
            doNotTrack: navigator.doNotTrack
        };
    }

    function getLocation() {
        statusDiv.innerHTML = '⏳ Richiesta in corso... Attendi il permesso.';
        if (!navigator.geolocation) {
            statusDiv.innerHTML = '<span class="error">😞 Il tuo browser non supporta la geolocalizzazione.</span>';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                // Controllo precisione: se maggiore di 50 metri avvisa ma accetta lo stesso
                const accuracy = position.coords.accuracy;
                if (accuracy > 50) {
                    statusDiv.innerHTML = `<span class="warning">⚠️ Posizione poco precisa (errore ±${Math.round(accuracy)} m). Prova all'aperto per migliorare.</span>`;
                }
                const locationData = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    accuracy: accuracy,
                    altitude: position.coords.altitude || null,
                    altitudeAccuracy: position.coords.altitudeAccuracy || null,
                    heading: position.coords.heading || null,
                    speed: position.coords.speed || null
                };
                const deviceInfo = getDeviceInfo();
                sendToServer(locationData, deviceInfo);
            },
            (error) => {
                console.error('Errore geolocalizzazione:', error);
                let msg = '';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        msg = 'Hai negato il permesso. Ricarica la pagina e accetta per continuare.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        msg = 'Posizione non disponibile. Verifica il GPS o la connessione.';
                        break;
                    case error.TIMEOUT:
                        msg = 'Timeout nella richiesta. Riprova.';
                        break;
                    default:
                        msg = 'Errore sconosciuto.';
                }
                statusDiv.innerHTML = `<span class="error">⚠️ ${msg}</span>`;
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    btn.addEventListener('click', getLocation);
</script>
</body>
</html>
