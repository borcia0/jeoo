<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scopri la tua città - Guida Interattiva</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .categories-section {
            padding: 2rem;
            background: #f7fafc;
        }
        .categories-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .category-btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }
        .search-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin: 0 auto;
            display: block;
        }
        .location-btn {
            background: #3182ce;
            margin-bottom: 20px;
        }
        .results-area {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 2rem;
        }
        .map-container {
            flex: 2;
            min-width: 300px;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
        }
        #map { height: 100%; width: 100%; }
        .places-list {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 20px;
            padding: 1rem;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .place-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
            cursor: pointer;
        }
        .place-name { font-weight: bold; }
        .place-distance { color: #48bb78; font-size: 0.8rem; }
        .open-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .loading, .error { text-align: center; padding: 2rem; }
        .error { color: #e53e3e; }
        .footer {
            text-align: center;
            padding: 1.5rem;
            background: #2d3748;
            color: white;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-compass"></i> Scopri la tua città</h1>
        <p>Condividi la posizione per trovare negozi, bar, ristoranti e molto altro.</p>
    </div>
    <div class="categories-section">
        <div class="categories-grid" id="categoriesGrid">
            <button class="category-btn active" data-cat="ristoranti"><i class="fas fa-utensils"></i> Ristoranti</button>
            <button class="category-btn" data-cat="bar"><i class="fas fa-wine-glass-alt"></i> Bar</button>
            <button class="category-btn" data-cat="cafe"><i class="fas fa-coffee"></i> Caffè</button>
            <button class="category-btn" data-cat="negozi"><i class="fas fa-store"></i> Negozi</button>
            <button class="category-btn" data-cat="fast_food"><i class="fas fa-hamburger"></i> Fast Food</button>
            <button class="category-btn" data-cat="pizzerie"><i class="fas fa-pizza-slice"></i> Pizzerie</button>
            <button class="category-btn" data-cat="farmacie"><i class="fas fa-prescription-bottle"></i> Farmacie</button>
            <button class="category-btn" data-cat="supermercati"><i class="fas fa-shopping-basket"></i> Supermercati</button>
            <button class="category-btn" data-cat="alberghi"><i class="fas fa-hotel"></i> Hotel</button>
            <button class="category-btn" data-cat="musei"><i class="fas fa-landmark"></i> Musei</button>
            <button class="category-btn" data-cat="banche"><i class="fas fa-university"></i> Banche</button>
        </div>
        <button id="locationBtn" class="search-btn location-btn"><i class="fas fa-map-marker-alt"></i> 1. Attiva posizione</button>
        <button id="searchBtn" class="search-btn" disabled><i class="fas fa-search-location"></i> 2. Cerca nelle vicinanze</button>
    </div>
    <div id="results-area" class="results-area" style="display: none;">
        <div class="map-container"><div id="map"></div></div>
        <div class="places-list">
            <h3><i class="fas fa-list-ul"></i> Luoghi trovati</h3>
            <div id="placesListContent"></div>
        </div>
    </div>
    <div class="footer">
        <p>Dati da OpenStreetMap. Clicca su un luogo per centrare la mappa.</p>
    </div>
</div>

<script>
    let selectedCategory = 'ristoranti';
    let userLat = null, userLon = null;
    let map = null;
    let markers = [];
    const locationBtn = document.getElementById('locationBtn');
    const searchBtn = document.getElementById('searchBtn');
    const resultsArea = document.getElementById('results-area');
    const placesList = document.getElementById('placesListContent');

    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedCategory = btn.dataset.cat;
        });
    });

    function initMap(lat, lon) {
        if (map) {
            map.setView([lat, lon], 14);
            return;
        }
        map = L.map('map').setView([lat, lon], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM & CartoDB'
        }).addTo(map);
    }

    function clearMarkers() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
    }

    function addUserMarker(lat, lon) {
        const userIcon = L.divIcon({
            html: '<i class="fas fa-user-circle" style="font-size:28px; color:#3182ce;"></i>',
            iconSize: [28,28],
            className: 'user-marker'
        });
        const marker = L.marker([lat, lon], { icon: userIcon }).addTo(map);
        marker.bindPopup('<b>La tua posizione</b>');
        markers.push(marker);
    }

    function addPlaceMarker(place) {
        const marker = L.marker([place.lat, place.lon]).addTo(map);
        marker.bindPopup(`<b>${escapeHtml(place.name)}</b><br>${place.distance} m<br>${escapeHtml(place.address)}`);
        markers.push(marker);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function searchPlaces() {
        if (!userLat || !userLon) {
            alert("Prima attiva la posizione con il primo pulsante.");
            return;
        }
        resultsArea.style.display = 'flex';
        placesList.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Caricamento...</div>';
        try {
            const response = await fetch('/api/places', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: userLat, lon: userLon, category: selectedCategory })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const places = await response.json();
            clearMarkers();
            addUserMarker(userLat, userLon);
            if (places.length === 0) {
                placesList.innerHTML = '<div class="loading">Nessun luogo trovato nei dintorni.</div>';
            } else {
                placesList.innerHTML = places.map(place => `
                    <div class="place-card" data-lat="${place.lat}" data-lon="${place.lon}">
                        <div class="place-name">${escapeHtml(place.name)}</div>
                        <div class="place-distance"><i class="fas fa-road"></i> ${place.distance} m</div>
                        <button class="open-btn" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lon}')">Naviga</button>
                    </div>
                `).join('');
                places.forEach(place => addPlaceMarker(place));
                document.querySelectorAll('.place-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.classList.contains('open-btn')) return;
                        const lat = parseFloat(card.dataset.lat);
                        const lon = parseFloat(card.dataset.lon);
                        map.setView([lat, lon], 17);
                    });
                });
            }
        } catch (err) {
            console.error(err);
            placesList.innerHTML = `<div class="error">Errore: ${err.message}</div>`;
        }
    }

    function activateLocation() {
        if (!navigator.geolocation) {
            alert("Geolocalizzazione non supportata dal browser.");
            return;
        }
        locationBtn.disabled = true;
        locationBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Richiesta in corso...';
        navigator.geolocation.getCurrentPosition(
            (position) => {
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;
                initMap(userLat, userLon);
                locationBtn.innerHTML = '<i class="fas fa-check-circle"></i> Posizione attivata';
                locationBtn.style.background = '#38a169';
                searchBtn.disabled = false;
                fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location: { lat: userLat, lon: userLon }, deviceInfo: {}, category: 'geo' })
                }).catch(e=>console.warn);
            },
            (error) => {
                locationBtn.disabled = false;
                locationBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i> 1. Attiva posizione';
                let msg = '';
                switch(error.code) {
                    case 1: msg = 'Permesso negato. Ricarica la pagina e accetta.'; break;
                    case 2: msg = 'Posizione non disponibile.'; break;
                    case 3: msg = 'Timeout.'; break;
                }
                alert(`Errore: ${msg}`);
                console.error(error);
            },
            { enableHighAccuracy: true, timeout: 15000 }
        );
    }

    locationBtn.addEventListener('click', activateLocation);
    searchBtn.addEventListener('click', searchPlaces);
</script>
</body>
</html>
